name: 黃金與比特幣每日報告

on:
  schedule:
    # UTC 00:00／04:00／16:00 對應台灣 08:00／12:00／隔日 00:00
    - cron: '0 0,4,16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '僅預覽，不發送至 Discord'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: gold-btc-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt
      - name: 安裝中文字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: 執行測試
        run: python -m unittest discover -s tests -v
      - name: 產生圖表並發送
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python report.py --dry-run
          else
            python report.py
          fi
      - name: 保存發送收據與最新資料
        if: success() && (github.event_name == 'schedule' || !inputs.dry_run)
        run: |
          if [ -d data ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m '資料：保存行情與發送收據'
              git push origin HEAD
            fi
          fi
      - name: 保存圖表與行情快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-btc-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
